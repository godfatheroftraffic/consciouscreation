  // 4g. AUDIT FORM (Fogg friction-free)
  function renderAuditForm(config) {
    var af = config.personalization && config.personalization.audit_form;
    var auditSec = document.getElementById('audit-section');
    if (!af || !af.enabled) {
      if (auditSec) auditSec.style.display = 'none';
      return;
    }
    setText('audit-label', af.label || '');
    document.getElementById('audit-headline').innerHTML =
      escapeHtml(af.headline_pre) + ' <em>' + escapeHtml(af.headline_accent) + '</em> ' + escapeHtml(af.headline_post);
    setText('audit-subheadline', af.subheadline || '');
    setText('audit-footnote', af.footnote || '');

    var form = document.getElementById('audit-form');
    if (!form || !af.fields) return;

    // Build fields
    var fieldsHTML = af.fields.map(function(f) {
      return '<div class="audit-field">' +
        '<label for="audit-' + escapeHtml(f.id) + '">' + escapeHtml(f.label) + '</label>' +
        '<input type="' + escapeHtml(f.type || 'text') + '" id="audit-' + escapeHtml(f.id) + '" name="' + escapeHtml(f.id) + '" placeholder="' + escapeHtml(f.placeholder || '') + '"' + (f.required ? ' required' : '') + ' />' +
        '</div>';
    }).join('');
    fieldsHTML += '<button type="submit" class="btn-primary">' + escapeHtml(af.submit_label || 'Run audit') + '</button>';
    form.innerHTML = fieldsHTML;

    var result = af.result || {};

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var url = (document.getElementById('audit-url') || {}).value || '';
      var traffic = parseFloat((document.getElementById('audit-traffic') || {}).value) || 0;
      var cpa = parseFloat((document.getElementById('audit-cpa') || {}).value) || 0;
      if (!url || !traffic || !cpa) return;

      // Estimate: ~30% of paid traffic that doesn't convert is recoverable. Convert that to dollars via CPA.
      // Conservative: assume current convert rate ~2.5%, leak rate of conversion-eligible traffic ~30%.
      // Recoverable monthly conversions = traffic × 2.5% × 30%. Value = recoverable_conversions × CPA.
      var recoverableConversions = Math.round(traffic * 0.025 * 0.30);
      var recoveryValue = recoverableConversions * cpa;
      var leakValue = recoveryValue * 1.4; // total leak is larger than what we recover
      var format$ = function(n) { return '$' + Math.round(n).toLocaleString('en-US'); };

      setText('audit-result-title', (result.title_template || '').replace(/\{url\}/g, url));
      setText('audit-leak-label', result.leak_label || '');
      setText('audit-recovery-label', result.recovery_label || '');
      setText('audit-leak-value', format$(leakValue));
      setText('audit-recovery-value', format$(recoveryValue));
      setText('audit-next-label', result.next_step_label || '');
      setText('audit-next-body', result.next_step_body || '');
      setText('audit-next-cta', result.next_step_cta || '');

      var resultEl = document.getElementById('audit-result');
      if (resultEl) {
        resultEl.classList.add('visible');
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }

  // 4h. CALCULATOR (Musk first-principles)
  function renderCalculator(config) {
    var c = config.personalization && config.personalization.calculator;
    if (!c || !c.enabled) return;
    setText('calculator-label', c.label || '');
    document.getElementById('calculator-headline').innerHTML =
      escapeHtml(c.headline_pre) + ' <em>' + escapeHtml(c.headline_accent) + '</em> ' + escapeHtml(c.headline_post);
    setText('calculator-subheadline', c.subheadline || '');

    var inputsEl = document.getElementById('calculator-inputs');
    var outputsEl = document.getElementById('calculator-outputs');
    if (!inputsEl || !outputsEl || !c.inputs) return;

    var values = {};
    c.inputs.forEach(function(inp) { values[inp.id] = inp.default; });
    // Hydrate from prior visit (return-visit personalization)
    var hydrated = hydrateCalculatorFromIntel(config, values, c.inputs);
    if (hydrated && window.__amplifai_session) {
      window.__amplifai_session.calcInputs = JSON.parse(JSON.stringify(values));
    }

    function format(n, fmt, prefix) {
      prefix = prefix || '';
      if (fmt === 'currency') return '$' + Math.round(n).toLocaleString('en-US');
      if (fmt === 'percent') return n.toFixed(1) + '%';
      if (fmt === 'number') return Math.round(n).toLocaleString('en-US');
      return String(n);
    }

    function formatCompact(n) {
      var num = Number(n) || 0;
      if (num >= 1000000) {
        var m = num / 1000000;
        var fixed = (m >= 100) ? 0 : (m >= 10 ? 1 : 1);
        var s = m.toFixed(fixed);
        if (s.indexOf('.') > -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
        return '$' + s + 'M';
      }
      if (num >= 1000) return '$' + Math.round(num / 1000) + 'K';
      return '$' + Math.round(num).toLocaleString('en-US');
    }

    function compute() {
      var traffic = values.monthly_traffic || 0;
      var cr = (values.current_cr || 0) / 100;
      var aov = values.aov || 0;
      var cac = values.current_cac || 0;
      var lift = (c.lift_assumption !== undefined ? c.lift_assumption : 0.25);
      var currentConversions = traffic * cr;
      var currentRevenue = currentConversions * aov;
      var liftedConversions = currentConversions * (1 + lift);
      var additionalRevenue = currentRevenue * lift;
      var annualRecovery = additionalRevenue * 12;
      var cacHalved = cac * 0.5;
      var customersAcquiredY1 = liftedConversions * 12;
      // Year-2 LTV multipliers come from the currency_range output config (config-driven, no hardcode)
      var rangeCfg = {};
      (c.outputs || []).forEach(function(o) { if (o.format === 'currency_range') rangeCfg = o; });
      var lowMult = rangeCfg.low_multiplier !== undefined ? rangeCfg.low_multiplier : 3;
      var highMult = rangeCfg.high_multiplier !== undefined ? rangeCfg.high_multiplier : 12;
      var ltvYear2Low = annualRecovery * lowMult;
      var ltvYear2High = annualRecovery * highMult;
      return {
        current_conversions: currentConversions,
        current_revenue: currentRevenue,
        cac_halved: cacHalved,
        lifted_conversions: liftedConversions,
        additional_revenue: additionalRevenue,
        customers_acquired_y1: customersAcquiredY1,
        annual_recovery: annualRecovery,
        ltv_year2_low: ltvYear2Low,
        ltv_year2_high: ltvYear2High
      };
    }

    function renderOutputs() {
      var out = compute();
      // Persist outputs to APS session for prospect intelligence
      if (window.__amplifai_session) {
        window.__amplifai_session.calcOutputs = out;
      }
      outputsEl.innerHTML = (c.outputs || []).map(function(o) {
        // Currency range (HERO) — special two-anchor structure with sublabel
        if (o.format === 'currency_range') {
          var low = out[o.low_id];
          var high = out[o.high_id];
          var lowFmt = (low !== undefined) ? formatCompact(low) : '—';
          var highFmt = (high !== undefined) ? formatCompact(high) : '—';
          return '<div class="calc-output size-hero highlight">' +
            '<span class="calc-output-label">' + escapeHtml(o.label) + '</span>' +
            '<div class="hero-range">' +
              '<span class="hero-low">' + escapeHtml(lowFmt) + '</span>' +
              '<span class="hero-arrow">→</span>' +
              '<span class="hero-high hero-pulse">' + escapeHtml(highFmt) + '</span>' +
            '</div>' +
            (o.sublabel ? '<div class="hero-sublabel">' + escapeHtml(o.sublabel) + '</div>' : '') +
            '</div>';
        }
        // Standard formats
        var val;
        if (o.format === 'static') {
          val = o.value || '—';
        } else if (out[o.id] !== undefined) {
          val = format(out[o.id], o.format, o.prefix);
        } else {
          val = '—';
        }
        var sizeClass = o.size === 'xl' ? ' size-xl' : '';
        return '<div class="calc-output' + (o.highlight ? ' highlight' : '') + sizeClass + '">' +
          '<span class="calc-output-label">' + escapeHtml(o.label) + '</span>' +
          '<span class="calc-output-value">' + escapeHtml(val) + '</span>' +
          '</div>';
      }).join('');
    }

    inputsEl.innerHTML = c.inputs.map(function(inp) {
      var initial = (values[inp.id] !== undefined) ? values[inp.id] : inp.default;
      return '<div class="calc-input">' +
        '<label class="calc-input-label">' + escapeHtml(inp.label) + '</label>' +
        '<div class="calc-input-wrap">' +
          (inp.prefix ? '<span class="calc-input-prefix">' + escapeHtml(inp.prefix) + '</span>' : '') +
          '<input type="number" class="calc-input-field" data-calc-id="' + escapeHtml(inp.id) + '" value="' + initial + '" step="' + (inp.format === 'percent' ? '0.1' : '1') + '" />' +
        '</div>' +
        '</div>';
    }).join('');

    inputsEl.querySelectorAll('.calc-input-field').forEach(function(el) {
      el.addEventListener('input', function() {
        var id = el.getAttribute('data-calc-id');
        values[id] = parseFloat(el.value) || 0;
        renderOutputs();
        // APS session: capture inputs + count fields changed from default
        if (window.__amplifai_session) {
          window.__amplifai_session.calcInputs = JSON.parse(JSON.stringify(values));
          var filled = 0;
          (c.inputs || []).forEach(function(inp) {
            if (values[inp.id] !== inp.default && values[inp.id] > 0) filled++;
          });
          window.__amplifai_session.formFieldsFilled = filled;
        }
      });
    });

    setText('calculator-footnote', c.footnote || '');
    setText('calculator-cta', c.cta || '');

    renderOutputs();
  }

  // 4i. YEAR 2 MATH (Balfour compounding)
  function renderYear2(config) {
    var y = config.personalization && config.personalization.year2_math;
    if (!y || !y.enabled) return;
    setText('year2-label', y.label || '');
    document.getElementById('year2-headline').innerHTML =
      escapeHtml(y.headline_pre) + ' <em>' + escapeHtml(y.headline_accent) + '</em>';
    setText('year2-subheadline', y.subheadline || '');
    setText('year2-footnote', y.footnote || '');
    var table = document.getElementById('year2-table');
    if (table && y.rows) {
      table.innerHTML = y.rows.map(function(r) {
        return '<div class="year2-row' + (r.highlight ? ' highlight' : '') + '">' +
          '<span class="year2-row-label">' + escapeHtml(r.label) + '</span>' +
          '<span class="year2-row-value">' + escapeHtml(r.value_template) + '</span>' +
          '</div>';
      }).join('');
    }
  }

  // 4j. COMPARISON TABLE (Thiel)
  function renderComparison(config) {
    var cmp = config.personalization && config.personalization.comparison;
    if (!cmp || !cmp.enabled) return;
    setText('comparison-label', cmp.label || '');
    document.getElementById('comparison-headline').innerHTML =
      escapeHtml(cmp.headline_pre) + ' <em>' + escapeHtml(cmp.headline_accent) + '</em> ' + escapeHtml(cmp.headline_post);
    setText('comparison-subheadline', cmp.subheadline || '');
    var table = document.getElementById('comparison-table');
    if (!table || !cmp.columns) return;

    var n = cmp.columns.length;
    table.style.gridTemplateColumns = 'repeat(' + n + ', minmax(180px, 1fr))';

    // Get unified row keys from first column
    var rowKeys = Object.keys(cmp.columns[0].rows || {});

    table.innerHTML = cmp.columns.map(function(col) {
      var cellsHTML = rowKeys.map(function(rk) {
        return '<div class="comparison-cell">' +
          '<div class="comparison-cell-label">' + escapeHtml(rk) + '</div>' +
          '<div class="comparison-cell-value">' + escapeHtml(col.rows[rk] || '—') + '</div>' +
          '</div>';
      }).join('');
      return '<div class="comparison-col' + (col.highlight ? ' highlight' : '') + '">' +
        '<div class="comparison-col-title">' + escapeHtml(col.title) + '</div>' +
        '<div class="comparison-col-tagline">' + escapeHtml(col.tagline) + '</div>' +
        cellsHTML +
        '</div>';
    }).join('');
  }

  // 4k. BEST FOR / NOT FOR (Dunford)
  function renderBestFor(config) {
    var b = config.personalization && config.personalization.best_for_not_for;
    if (!b || !b.enabled) return;
    setText('bestfor-label', b.label || '');
    document.getElementById('bestfor-headline').innerHTML =
      escapeHtml(b.headline_pre) + ' <em>' + escapeHtml(b.headline_accent) + '</em> ' + escapeHtml(b.headline_post);
    setText('bestfor-subheadline', b.subheadline || '');
    if (b.best_for) {
      setText('bestfor-yes-label', b.best_for.label || '');
      var yes = document.getElementById('bestfor-yes-list');
      if (yes) yes.innerHTML = (b.best_for.items || []).map(function(i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('');
    }
    if (b.not_for) {
      setText('bestfor-no-label', b.not_for.label || '');
      var no = document.getElementById('bestfor-no-list');
      if (no) no.innerHTML = (b.not_for.items || []).map(function(i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('');
    }
  }

  // 5. APPLY CTA WIRING — TypeBot redirect with full param forwarding + APS signals
  function wireApplyCTAs(config, params) {
    var tbBase = config.typebot.apply_url;
    var allowed = config.typebot.forward_params || [];

    function computeAPS() {
      var aps_cfg = (config.personalization && config.personalization.aps_scoring) || {};
      if (!aps_cfg.enabled) return null;
      var session = window.__amplifai_session || {};
      var weights = aps_cfg.weights || {};
      var tiers = aps_cfg.tiers || {};
      var eps = parseFloat(params.eps_score);
      if (isNaN(eps)) eps = aps_cfg.default_eps || 50;
      var aps = eps;
      var timeOnPage = Math.round((Date.now() - (session.startTime || Date.now())) / 1000);
      if ((session.scrollMax || 0) >= 75) aps += weights.scroll_75 || 0;
      if (timeOnPage >= 30) aps += weights.time_30s || 0;
      if ((session.formFieldsFilled || 0) >= 3) aps += weights.form_fields_3plus || 0;
      if (session.slipperyCompleted) aps += weights.slippery_completed || 0;
      if (session.calculatorSubmitted) aps += weights.calculator_submitted || 0;
      aps = Math.max(0, Math.min(100, aps));
      var tier = 'cold';
      if (aps >= (tiers.hot || 80)) tier = 'hot';
      else if (aps >= (tiers.warm || 60)) tier = 'warm';
      else if (aps >= (tiers.cool || 40)) tier = 'cool';
      return {
        score: Math.round(aps),
        tier: tier,
        time_on_page: timeOnPage,
        scroll_depth: session.scrollMax || 0,
        slippery_verdict: session.slipperyVerdict || '',
        slippery_completed: !!session.slipperyCompleted,
        calculator_submitted: !!session.calculatorSubmitted,
        calc_inputs: session.calcInputs || {}
      };
    }

    function buildFinalUrl() {
      var fwd = new URLSearchParams();
      allowed.forEach(function(key) {
        if (params[key] !== undefined && params[key] !== '') {
          fwd.append(key, params[key]);
        }
      });
      fwd.append('lp_source', config.brand.domain || window.location.hostname);
      fwd.append('lp_path', window.location.pathname);

      var apsData = computeAPS();
      if (apsData) {
        if (allowed.indexOf('aps_score') > -1) fwd.set('aps_score', String(apsData.score));
        if (allowed.indexOf('intent_tier') > -1) fwd.set('intent_tier', apsData.tier);
        if (allowed.indexOf('time_on_page') > -1) fwd.set('time_on_page', String(apsData.time_on_page));
        if (allowed.indexOf('scroll_depth') > -1) fwd.set('scroll_depth', String(apsData.scroll_depth));
        if (allowed.indexOf('slippery_verdict') > -1 && apsData.slippery_verdict) fwd.set('slippery_verdict', apsData.slippery_verdict);
        if (allowed.indexOf('slippery_completed') > -1) fwd.set('slippery_completed', String(apsData.slippery_completed));
        if (allowed.indexOf('calculator_submitted') > -1) fwd.set('calculator_submitted', String(apsData.calculator_submitted));
        var ci = apsData.calc_inputs || {};
        Object.keys(ci).forEach(function(k) {
          if (allowed.indexOf(k) > -1 && ci[k]) fwd.set(k, String(ci[k]));
        });
      }

      // Prospect Intelligence — structured data for AI agent brain + return-visit personalization
      var intel = buildProspectIntelligence(config, params, apsData);
      if (intel) {
        // 1. Persist to localStorage for return-visit hydration
        saveProspectIntel(config, intel);
        // 2. Push to dataLayer (GTM forwards to AI agent webhook)
        var pi_cfg = getProspectIntelCfg(config) || {};
        if (window.dataLayer && pi_cfg.datalayer_event) {
          window.dataLayer.push({
            event: pi_cfg.datalayer_event,
            prospect_intelligence: intel
          });
        }
        // 3. Append calculator outputs as flat params (TypeBot reads natively)
        var co = (intel.calculator && intel.calculator.outputs) || {};
        Object.keys(co).forEach(function(k) {
          if (allowed.indexOf(k) > -1 && co[k] !== undefined && co[k] !== null) {
            fwd.set(k, String(Math.round(Number(co[k]))));
          }
        });
        // 4. Append session_id + visit_count
        if (allowed.indexOf('session_id') > -1) fwd.set('session_id', intel.session_id);
        if (allowed.indexOf('visit_count') > -1) fwd.set('visit_count', String(intel.visit_count));
        // 5. Append base64 JSON blob (agent webhook decodes full structured object)
        var blobParam = pi_cfg.url_blob_param || 'prospect_data';
        if (allowed.indexOf(blobParam) > -1) {
          var blob = encodeProspectBlob(intel);
          if (blob) fwd.set(blobParam, blob);
        }
      }

      var separator = tbBase.indexOf('?') > -1 ? '&' : '?';
      return tbBase + separator + fwd.toString();
    }

    var ctas = document.querySelectorAll('[data-apply]');
    ctas.forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        // Mark calculator submission for APS scoring
        if (el.id === 'calculator-cta' && window.__amplifai_session) {
          window.__amplifai_session.calculatorSubmitted = true;
        }
        var finalUrl = buildFinalUrl();
        if (window.dataLayer) {
          window.dataLayer.push({
            event: 'apply_cta_click',
            cta_id: el.id || 'unknown',
            cta_section: getSectionName(el),
            typebot_url: finalUrl
          });
        }
        window.location.href = finalUrl;
      });
    });
  }

  function getSectionName(el) {
    var cur = el;
    while (cur && cur !== document.body) {
      if (cur.tagName === 'SECTION') {
        var classes = Array.prototype.filter.call(cur.classList, function(c) { return c !== 'pre-load'; });
        return classes.join(' ') || 'section';
      }
      if (cur.tagName === 'NAV') return 'nav';
      cur = cur.parentElement;
    }
    return 'unknown';
  }

  // 5. FLOATING CTA reveal
  function initFloatingCTA() {
    var fc = document.getElementById('floating-cta');
    var shown = false;
    var handler = function() {
      if (shown) return;
      if (window.scrollY > 400) {
        fc.classList.add('visible');
        shown = true;
        window.removeEventListener('scroll', handler);
      }
    };
    window.addEventListener('scroll', handler, { passive: true });
    handler();
  }

  // 6. REVEAL OBSERVER
  function initRevealObserver() {
    if (!('IntersectionObserver' in window)) return;
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) entry.target.classList.add('in');
      });
    }, { threshold: 0.1 });

    var selectors = '.problem h2, .problem-grid > div, .bucket-viz, .mechanism h2, .mechanism-intro, .mech-cell, .channels h2, .channels-sub, .channels-orbit, .channels-list, .ltv-callout, .loom-title, .loom-subtitle, .loom-embed, .math-headline, .math-row, .slippery-intro, .slippery-stage, .authority h2, .authority-grid, .audit h2, .audit-form, .calculator h2, .calculator-grid, .year2 h2, .year2-table, .comparison h2, .comparison-table, .bestfor h2, .bestfor-grid, .offer-frame, .qualify h2, .qualify-col, .weapon-line, .cta h2, .cta p, .cta-row';
    var nodes = document.querySelectorAll(selectors);
    nodes.forEach(function(el) {
      el.classList.add('reveal');
      observer.observe(el);
    });
  }

  // 7. UTILITIES
  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function setLogo(parts) {
    var el = document.getElementById('brand-logo');
    if (!el || !parts || parts.length < 2) return;
    el.innerHTML = escapeHtml(parts[0]) + '<span>' + escapeHtml(parts[1]) + '</span>';
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
})();
</script>
