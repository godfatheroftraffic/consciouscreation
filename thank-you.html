<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Download</title>
  <meta name="robots" content="noindex, nofollow">

  <link id="brand-font-link" rel="stylesheet" href="">

  <style>
    /* ============================================================
       ECHO DOWNLOAD PAGE v1.0 (was thank-you) — STYLES
       Conversion #2 (PDF download) fires on the download click.
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
      font-family: var(--brand-font, 'Inter', system-ui, sans-serif);
      background: #050510;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    :root {
      --brand-font: 'Inter', system-ui, sans-serif;
      --btn-color: #1F1647;
      --accent: #7c3aed;
      --overlay-opacity: 0.65;
    }

    #bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center top, #1a1246 0%, #050510 60%);
      z-index: -1;
    }
    #hero-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center center; background-repeat: no-repeat;
      z-index: 0;
    }
    #hero-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, var(--overlay-opacity)); z-index: 1;
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.20; z-index: 0;
      animation: orbFloat 10s ease-in-out infinite;
    }
    .bg-orb-1 { width: 420px; height: 420px; background: var(--btn-color); top: -120px; left: -100px; animation-delay: 0s; }
    .bg-orb-2 { width: 320px; height: 320px; background: var(--accent);    bottom: -80px; right: -80px; animation-delay: -5s; }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(18px,-18px) scale(1.04); }
      66%      { transform: translate(-14px,14px) scale(0.96); }
    }

    #page-wrapper { position: relative; z-index: 2; display: flex; flex-direction: column; min-height: 100vh; }
    #main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; }

    #dl-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 44px;
      max-width: 540px; width: 100%;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    #dl-logo { display: none; margin-bottom: 24px; }
    #dl-logo img { height: 40px; width: auto; object-fit: contain; opacity: 0.9; }

    #dl-eyebrow {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent-text, rgba(255,255,255,0.55));
      margin-bottom: 22px;
      padding: 6px 14px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03);
    }

    /* ── BOOK COVER ─────────────────────────────────────────── */
    #cover-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
    #cover-frame {
      position: relative;
      width: 180px; max-width: 55%;
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
      transform: perspective(1000px) rotateY(-8deg);
      transition: transform 0.4s ease;
      animation: coverIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    #cover-frame:hover { transform: perspective(1000px) rotateY(0deg) translateY(-4px); }
    #cover-frame img { display: block; width: 100%; height: auto; }
    #cover-frame.placeholder {
      aspect-ratio: 3 / 4;
      background: linear-gradient(135deg, #241a52, #12102a);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.35); font-size: 12px; padding: 20px; text-align: center;
    }
    @keyframes coverIn { 0% { opacity: 0; transform: perspective(1000px) rotateY(-8deg) translateY(20px); } 100% { opacity: 1; } }

    #dl-title { font-size: 1.75rem; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: -0.02em; line-height: 1.2; }
    #dl-subtitle { font-size: 1rem; color: rgba(255,255,255,0.65); line-height: 1.6; margin-bottom: 32px; max-width: 420px; margin-left: auto; margin-right: auto; }

    #dl-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--btn-color); color: #fff;
      font-size: 1.05rem; font-weight: 700;
      padding: 17px 44px; border-radius: 12px;
      text-decoration: none; cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    #dl-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
    #dl-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    #dl-btn.is-downloading { pointer-events: none; opacity: 0.85; }

    #dl-note { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 16px; }

    /* ── FOOTER (unchanged from template) ───────────────────── */
    #page-footer { position: relative; z-index: 2; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.06); padding: 20px; text-align: center; }
    #footer-inner { max-width: 600px; margin: 0 auto; }
    #footer-logo-wrap { margin-bottom: 12px; }
    #footer-logo-wrap img { height: 36px; width: auto; opacity: 0.7; }
    #footer-social { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .social-icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; color: rgba(255,255,255,0.5); text-decoration: none; transition: all 0.2s; border: 1px solid transparent; }
    .social-icon:hover { color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
    .social-icon svg { width: 16px; height: 16px; fill: currentColor; }
    #footer-links { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    #footer-links a { color: rgba(255,255,255,0.35); text-decoration: none; font-size: 11px; transition: color 0.2s; }
    #footer-links a:hover { color: rgba(255,255,255,0.7); }
    #footer-links .sep { color: rgba(255,255,255,0.15); font-size: 11px; }
    #footer-copyright { font-size: 11px; color: rgba(255,255,255,0.25); }

    #debug-panel { display: none; position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.92); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 16px; font-size: 11px; color: #4ade80; font-family: monospace; z-index: 9999; max-width: 320px; max-height: 500px; overflow-y: auto; line-height: 1.6; }
    #debug-panel.active { display: block; }
    #debug-panel .dtitle { color: #facc15; font-weight: 700; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }

    @media (max-width: 600px) {
      #dl-card { padding: 36px 24px; margin: 0 8px; }
      #dl-title { font-size: 1.4rem; }
      #cover-frame { width: 150px; }
    }
  </style>
</head>
<body>

  <div id="bg-gradient"></div>
  <div id="hero-bg"></div>
  <div id="hero-overlay"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div id="page-wrapper">
    <main id="main-content">
      <div id="dl-card">

        <div id="dl-logo"><img id="dl-logo-img" src="" alt="Brand Logo"></div>

        <span id="dl-eyebrow">Your copy is ready</span>

        <div id="cover-wrap">
          <div id="cover-frame" class="placeholder"><span id="cover-fallback">Book cover<br>(add cover image)</span></div>
        </div>

        <h1 id="dl-title">Your download is ready</h1>
        <p id="dl-subtitle">Tap the button below to download your PDF.</p>

        <a id="dl-btn" href="#" download>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
          <span id="dl-btn-text">Download the PDF</span>
        </a>

        <p id="dl-note"></p>

      </div><!-- /#dl-card -->
    </main>

    <footer id="page-footer">
      <div id="footer-inner">
        <div id="footer-logo-wrap" style="display:none;">
          <a id="footer-logo-link" href="#" target="_blank" rel="noopener">
            <img id="footer-logo-img" src="" alt="Brand Logo">
          </a>
        </div>
        <div id="footer-social" style="display:none;"></div>
        <nav id="footer-links" aria-label="Footer links"></nav>
        <p id="footer-copyright"></p>
      </div>
    </footer>
  </div>

  <div id="debug-panel">
    <div class="dtitle">DOWNLOAD PAGE v1.0 DEBUG</div>
    <div id="debug-content"></div>
  </div>

  <script>
  (function() {
    'use strict';

    function getCookie(name) {
      var nameEQ = name + '=';
      var ca = document.cookie.split(';');
      for (var i = 0; i < ca.length; i++) {
        var c = ca[i].trim();
        if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length));
      }
      return '';
    }

    var urlParams = (function() {
      var p = {};
      window.location.search.substring(1).split('&').forEach(function(pair) {
        var kv = pair.split('=');
        if (kv[0]) p[decodeURIComponent(kv[0])] = kv[1] ? decodeURIComponent(kv[1].replace(/\+/g, ' ')) : '';
      });
      return p;
    })();

    function getParam(primary, aliases) {
      if (urlParams[primary]) return urlParams[primary];
      if (aliases) { for (var i = 0; i < aliases.length; i++) if (urlParams[aliases[i]]) return urlParams[aliases[i]]; }
      return getCookie(primary) || '';
    }

    function deepGet(obj, path, fallback) {
      try { var v = path.reduce(function(o,k){return o[k];}, obj); return (v === undefined || v === null || v === '') ? fallback : v; }
      catch(e) { return fallback; }
    }

    var trackingData = {
      conversion: getParam('conversion', ['trck', 'click_id', 'cid']),
      campaign:   getParam('campaign',   ['campaign_id']),
      banner:     getParam('banner',     ['creative_id', 'banner_id']),
      publisher:  getParam('publisher',  ['publisher_id']),
      at:        getParam('at', ['archetype']),
      ag:        getParam('ag', ['angle']),
      ad:        getParam('ad', []),
      archetype: getParam('archetype', ['at']),
      angle:     getParam('angle', ['ag']),
      phase:     getParam('phase', []),
      eps_score: getParam('eps_score', ['eps']),
      email: getParam('email', ['e']),
      name:  getParam('name',  ['n']),
      fname: getParam('fname', ['first_name']),
      city:   getParam('city', []),
      region: getParam('region', []),
      country: getParam('country', []),
      device_type: getParam('device_type', []),
      lp_url:       getCookie('lp_url'),
      dl_url:       window.location.href,
      dl_timestamp: new Date().toISOString()
    };
    trackingData.archetype = trackingData.archetype || trackingData.at;
    trackingData.angle     = trackingData.angle     || trackingData.ag;

    var epsScore  = parseFloat(trackingData.eps_score) || 0;
    var apsScore  = 100; // CANONICAL: main conversion → APS 100
    var debugMode = getParam('debug', []) === '1' || getParam('test_all', []) === '1';

    window.dataLayer = window.dataLayer || [];
    var brandConfig = {};
    var conversionFired = false;

    function getApsTierLabel(score) {
      var tiers   = deepGet(brandConfig, ['tracking', 'aps', 'quality_tiers'], {});
      var high    = typeof tiers.high     === 'number' ? tiers.high     : 80;
      var medHigh = typeof tiers.med_high === 'number' ? tiers.med_high : 65;
      var medium  = typeof tiers.medium   === 'number' ? tiers.medium   : 50;
      var medLow  = typeof tiers.med_low  === 'number' ? tiers.med_low  : 35;
      if (score >= high)    return 'high';
      if (score >= medHigh) return 'med_high';
      if (score >= medium)  return 'medium';
      if (score >= medLow)  return 'med_low';
      return 'low';
    }

    // ── CONVERSION #2: fires on the DOWNLOAD CLICK (step_3) ──────
    function fireDownloadConversion() {
      if (conversionFired) return;
      conversionFired = true;

      window.dataLayer.push(Object.assign({}, trackingData, {
        event:       'pdf_download',
        funnel_step: 'step_3',
        dsp_step:    'step_3',
        aps_current: apsScore,
        aps_tier:    getApsTierLabel(apsScore),
        eps_initial: epsScore
      }));

      window.dataLayer.push(Object.assign({}, trackingData, {
        event:            'thankyou_conversion',
        funnel_step:      'step_3',
        dsp_step:         'step_3',
        conversion:       trackingData.conversion,
        campaign:         trackingData.campaign,
        banner:           trackingData.banner,
        publisher:        trackingData.publisher,
        archetype:        trackingData.archetype,
        angle:            trackingData.angle,
        ad:               trackingData.ad,
        phase:            trackingData.phase,
        eps_score:        epsScore,
        aps_score:        apsScore,
        aps_current:      apsScore,
        aps_tier:         getApsTierLabel(apsScore),
        eps_initial:      epsScore
      }));

      var dspEnabled = deepGet(brandConfig, ['conversion_tracker', 'dspPostback', 'enabled'], true);
      if (dspEnabled) {
        window.dataLayer.push({
          event:            'dsp_postback',
          funnel_step:      'step_3',
          dsp_step:         'step_3',
          conversion:       trackingData.conversion,
          conversion_value: deepGet(brandConfig, ['conversion_values', 'step_3'], 0),
          campaign:         trackingData.campaign,
          banner:           trackingData.banner,
          publisher:        trackingData.publisher,
          archetype:        trackingData.archetype,
          angle:            trackingData.angle,
          ad:               trackingData.ad,
          aps_current:      apsScore,
          aps_tier:         getApsTierLabel(apsScore),
          eps_initial:      epsScore
        });
      }

      window.dataLayer.push({
        event:       'master_converted_retargeting',
        funnel_step: 'step_3',
        conversion:  trackingData.conversion,
        archetype:   trackingData.archetype,
        angle:       trackingData.angle,
        ad:          trackingData.ad,
        phase:       trackingData.phase,
        aps_current: apsScore,
        aps_tier:    getApsTierLabel(apsScore),
        campaign:    trackingData.campaign,
        banner:      trackingData.banner,
        publisher:   trackingData.publisher
      });

      // ── ADKERNEL CONVERSION #2: PDF download ──
      (function(){
        var akConv   = deepGet(brandConfig, ['tracking','adkernel','conversion'], {});
        var goalId   = deepGet(akConv, ['download_goal_id'], '');
        var convBase = deepGet(akConv, ['base_url'], 'https://xml.amplifai.it.com/conversion');
        var clickId  = trackingData.conversion;
        if (goalId && clickId) {
          var val = deepGet(brandConfig, ['conversion_values','step_3'], 0);
          var px  = new Image();
          px.src  = convBase + '?id=' + encodeURIComponent(goalId)
                  + '&c=' + encodeURIComponent(clickId)
                  + '&count=1&value=' + encodeURIComponent(val);
          if (debugMode) console.log('[Download] AdKernel download conversion fired for click ' + clickId);
        }
      })();
      if (debugMode) console.log('[Download] Conversion #2 (pdf_download / step_3) fired');
    }

    function init() {
      fetch('./brand-config.json?v=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(config) { brandConfig = config; onConfigLoaded(config); })
        .catch(function() { brandConfig = {}; onConfigLoaded({}); });
    }

    function onConfigLoaded(config) {

      // ── GTM ──────────────────────────────────────────────────
      var gtmId = deepGet(config, ['brand', 'gtmId'], '');
      if (gtmId && gtmId !== 'GTM-XXXXXXX') {
        (function(w,d,s,l,i){
          w[l]=w[l]||[]; w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
          var f=d.getElementsByTagName(s)[0]; var j=d.createElement(s);
          j.async=true; j.src='https://www.googletagmanager.com/gtm.js?id='+i;
          f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',gtmId);
      }

      // ── ADKERNEL UNIVERSAL PIXEL ─────────────────────────────
      var akAccountId = deepGet(config, ['tracking', 'adkernel', 'account_id'], '');
      if (akAccountId) {
        var akPixel = document.createElement('img');
        akPixel.src = 'https://rtb2-useast.amplifai.it.com/universalPixel?account=' + encodeURIComponent(akAccountId);
        akPixel.setAttribute('style', 'width:1px;height:1px;display:none;');
        akPixel.setAttribute('referrerpolicy', 'unsafe-url');
        akPixel.alt = '';
        document.body.appendChild(akPixel);
      }

      // ── FONT / ACCENT / BACKGROUND ───────────────────────────
      var fontUrl    = deepGet(config, ['branding', 'font', 'url'], '');
      var fontFamily = deepGet(config, ['branding', 'font', 'family'], 'Inter');
      if (fontUrl) document.getElementById('brand-font-link').href = fontUrl;
      document.documentElement.style.setProperty('--brand-font', "'" + fontFamily + "', system-ui, sans-serif");
      document.body.style.fontFamily = "'" + fontFamily + "', system-ui, sans-serif";

      var btnColor = deepGet(config, ['landing_page', 'styling', 'button_color'],
                     deepGet(config, ['brand', 'accent_color'], '#1F1647'));
      document.documentElement.style.setProperty('--btn-color', btnColor);

      var isMobile = window.innerWidth <= 768;
      var bgImg    = deepGet(config, ['landing_page', 'defaults', 'background_image'], '');
      var bgImgMob = deepGet(config, ['landing_page', 'defaults', 'background_image_mobile'], '');
      var heroSrc  = isMobile && bgImgMob ? 'public/' + bgImgMob : (bgImg ? 'public/' + bgImg : '');
      if (heroSrc) { var hbg = document.getElementById('hero-bg'); if (hbg) hbg.style.backgroundImage = "url('" + heroSrc + "')"; }
      var oMap = { light: 0.30, medium: 0.50, dark: 0.65, xdark: 0.80 };
      document.documentElement.style.setProperty('--overlay-opacity', oMap[deepGet(config, ['landing_page', 'defaults', 'overlay'], 'dark')] || 0.65);

      // ── LOGO ─────────────────────────────────────────────────
      var logoFile = deepGet(config, ['branding', 'logo', 'filename'], '');
      if (logoFile) {
        document.getElementById('dl-logo-img').src = 'public/' + logoFile;
        document.getElementById('dl-logo-img').alt = deepGet(config, ['branding', 'logo', 'alt'], 'Brand Logo');
        document.getElementById('dl-logo').style.display = 'block';
      }

      // ── DOWNLOAD CONTENT (from brand-config.thank_you_page.download) ──
      var dl = deepGet(config, ['thank_you_page', 'download'], {});
      document.title = deepGet(config, ['brand', 'name'], 'Download') + ' — Download';

      var eyebrow = deepGet(dl, ['eyebrow'], 'Your copy is ready');
      var title   = deepGet(dl, ['headline'], deepGet(config, ['thank_you_page', 'headline'], 'Your download is ready'));
      var sub     = deepGet(dl, ['subheadline'], 'Tap the button below to download your PDF.');
      var btnText = deepGet(dl, ['button_text'], 'Download the PDF');
      var note    = deepGet(dl, ['note'], '');
      var coverFile = deepGet(dl, ['cover'], '');
      var pdfFile   = deepGet(dl, ['pdf'], '');

      document.getElementById('dl-eyebrow').textContent = eyebrow;
      document.getElementById('dl-title').textContent   = title;
      document.getElementById('dl-subtitle').textContent = sub;
      document.getElementById('dl-btn-text').textContent = btnText;
      if (note) { document.getElementById('dl-note').textContent = note; }

      // Cover image
      if (coverFile) {
        var frame = document.getElementById('cover-frame');
        frame.classList.remove('placeholder');
        var img = document.createElement('img');
        img.src = 'public/' + coverFile;
        img.alt = title + ' — cover';
        frame.innerHTML = '';
        frame.appendChild(img);
      }

      // Download button
      var btn = document.getElementById('dl-btn');
      if (pdfFile) {
        btn.href = 'public/' + pdfFile;
        btn.setAttribute('download', '');
      }
      btn.addEventListener('click', function(e) {
        // Fire Conversion #2 first, then let the browser download proceed
        fireDownloadConversion();
        document.getElementById('dl-btn-text').textContent = 'Downloading…';
        btn.classList.add('is-downloading');
        setTimeout(function() {
          document.getElementById('dl-btn-text').textContent = 'Download again';
          btn.classList.remove('is-downloading');
        }, 2500);
        if (!pdfFile) { e.preventDefault(); } // no PDF wired yet → don't navigate to '#'
      });

      buildFooter(config);

      // Light page-view signal (NOT the conversion)
      window.dataLayer.push(Object.assign({}, trackingData, {
        event: 'download_page_view', funnel_step: 'step_3', dsp_step: 'step_3'
      }));

      if (debugMode) {
        document.getElementById('debug-panel').classList.add('active');
        document.getElementById('debug-content').innerHTML = [
          'Download Page v1.0',
          '─────────────────',
          'Conversion ID: ' + (trackingData.conversion || '(none)'),
          'Campaign: ' + (trackingData.campaign || '(none)'),
          'Cover: ' + (coverFile || '(none)'),
          'PDF: ' + (pdfFile || '(none)'),
          'AdKernel acct: ' + (akAccountId || '(BLANK)'),
          'GTM: ' + (gtmId || '(BLANK)'),
          'Conv value (step_3): ' + deepGet(config, ['conversion_values', 'step_3'], 0)
        ].join('<br>');
      }
    }

    function buildFooter(config) {
      var footerEnabled = deepGet(config, ['footer', 'enabled'], true);
      if (!footerEnabled) { document.getElementById('page-footer').style.display = 'none'; return; }

      var fl = document.getElementById('footer-links');
      var defaults = { privacy: {text:'Privacy Policy',url:'/privacy'}, terms: {text:'Terms of Service',url:'/terms'}, cookies: {text:'Cookie Policy',url:'/cookies'}, contact: {text:'Contact',url:'/contact'} };
      var activeLinks = ['privacy','terms','cookies','contact'].filter(function(k) {
        return deepGet(config, ['footer', 'links', k, 'enabled'], true);
      });
      activeLinks.forEach(function(key, idx) {
        var a = document.createElement('a');
        a.href = deepGet(config, ['footer', 'links', key, 'url'], defaults[key].url);
        a.textContent = deepGet(config, ['footer', 'links', key, 'text'], defaults[key].text);
        fl.appendChild(a);
        if (idx < activeLinks.length - 1) { var s = document.createElement('span'); s.className='sep'; s.textContent='·'; fl.appendChild(s); }
      });

      document.getElementById('footer-copyright').textContent =
        deepGet(config, ['brand', 'copyright'], '© ' + new Date().getFullYear() + ' Conscious Creation. All rights reserved.');
    }

    init();
  })();
